name: CI

on:
  push:
  pull_request:

jobs:
  generated-data:
    name: Generated Coq data matches data/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/gen_coq.py --check

  build:
    name: Build and audit (Coq ${{ matrix.coq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq: ['8.18', '8.19', '8.20']
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.coq }}
          ocaml_version: 'default'
          custom_script: |
            startGroup "Build"
              sudo chown -R coq:coq .
              make -j2
            endGroup
            startGroup "Axiom audit"
              sh tools/check_assumptions.sh
            endGroup
